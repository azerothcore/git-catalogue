<div class="row">
  <div class="col-6">
    <label for="search-input">Search by name, description, topic or author:</label>

    <div class="input-group mb-3">
      <div class="input-group-prepend">
        <span class="input-group-text" id="search">
          <fa-icon [icon]="faSearch"></fa-icon>
        </span>
      </div>
      <input
        id="search-input"
        #searchInput
        type="search"
        class="form-control"
        placeholder="Search the catalogue (press /)"
        [(ngModel)]="search"
        (ngModelChange)="onSearchChange($event)"
        (keydown.escape)="clearSearch()"
        aria-label="Search by name, description, topic or author"
        aria-describedby="search"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="input-group-append" *ngIf="search">
        <button type="button" class="btn btn-outline-secondary" (click)="clearSearch()" aria-label="Clear search">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    </div>

    <label for="sort">Sort items by:</label>

    <select id="sort" class="form-control mb-3" [(ngModel)]="sort" (ngModelChange)="onSortChange($event)" aria-label="Sort">
      <option *ngFor="let option of sortOptions" [value]="option.key">{{ option.label }}</option>
    </select>
  </div>

  <div class="col-6">
    <div class="col alert alert-info alert-submit">
      <p>Want to submit your <b>repository</b>? Check the instructions <a href="#/how-to">here</a></p>
    </div>
  </div>
</div>

<div class="row" *ngIf="catalogueService.tabIndex !== -1">
  <div class="col-12">
    <mat-tab-group (focusChange)="resetPage()" [selectedIndex]="catalogueService.tabIndex" (selectedTabChange)="onTabChange($event)">
      <mat-tab *ngFor="let key of catalogueService.confTabsKeys" label="{{ key }}">
        <div *ngIf="catalogueService.items$[key] | async as items" class="mt-2">
          <div *ngIf="search && filteredLength(items) > 0" class="text-muted small mb-2" role="status" aria-live="polite">
            {{ searchStatus(filteredLength(items)) }}
          </div>

          <div
            *ngIf="search && filteredLength(items) === 0"
            class="alert alert-warning d-flex flex-wrap align-items-center justify-content-between"
            role="status"
            aria-live="polite"
          >
            <span class="mr-2">No repositories match “{{ search }}”. Try a different name, description or topic.</span>
            <button type="button" class="btn btn-sm btn-outline-dark" (click)="clearSearch()">Clear search</button>
          </div>

          <div *ngFor="let item of currentPageItems(items)">
            <app-repo
              [id]="item.id"
              [name]="item.name"
              [stars]="item.stargazers_count"
              [created]="item.created_at"
              [updated]="item.pushed_at"
              [description]="item.description"
              [fullName]="item.full_name"
            >
            </app-repo>
          </div>

          <mat-paginator
            *ngIf="filteredLength(items) > 0"
            [pageIndex]="page"
            [length]="filteredLength(items)"
            [pageSize]="catalogueService.CONF.pageSize"
            (page)="onPageChange($event)"
            [hidePageSize]="true"
          >
          </mat-paginator>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
