<section class="catalogue">
  <header class="catalogue-toolbar">
    <div class="catalogue-search">
      <label class="sr-only" for="search-input">Search the catalogue</label>
      <div class="search-box">
        <fa-icon class="search-icon" [icon]="faSearch" aria-hidden="true"></fa-icon>
        <input
          id="search-input"
          #searchInput
          type="text"
          role="searchbox"
          inputmode="search"
          enterkeyhint="search"
          [(ngModel)]="search"
          (ngModelChange)="onSearchChange($event)"
          (keydown.escape)="clearSearch()"
          placeholder="Search by name, description, topic or author…"
          aria-label="Search by name, description, topic or author"
          autocomplete="off"
          spellcheck="false"
        />
        <button *ngIf="search" type="button" class="search-clear" (click)="clearSearch()" aria-label="Clear search">
          <span aria-hidden="true">&times;</span>
        </button>
        <kbd *ngIf="!search" class="search-hint" aria-hidden="true">/</kbd>
      </div>
    </div>

    <div class="catalogue-sort">
      <label for="sort">Sort</label>
      <select id="sort" [(ngModel)]="sort" (ngModelChange)="onSortChange($event)" aria-label="Sort repositories">
        <option *ngFor="let option of sortOptions" [value]="option.key">{{ option.label }}</option>
      </select>
    </div>
  </header>

  <p class="catalogue-hint">Can't find a repository? <a href="#/how-to">Check how to add it</a>.</p>

  <div *ngIf="catalogueService.tabIndex !== -1">
    <mat-tab-group
      class="catalogue-tabs"
      (focusChange)="resetPage()"
      [selectedIndex]="catalogueService.tabIndex"
      (selectedTabChange)="onTabChange($event)"
    >
      <mat-tab *ngFor="let key of catalogueService.confTabsKeys" label="{{ key }}">
        <div *ngIf="catalogueService.items$[key] | async as items" class="tab-body">
          <div class="results-bar" *ngIf="filteredLength(items) > 0">
            <span *ngIf="search; else totalCount" role="status" aria-live="polite">{{ searchStatus(filteredLength(items)) }}</span>
            <ng-template #totalCount>
              <span>{{ repositoryCount(filteredLength(items)) }}</span>
            </ng-template>
            <button *ngIf="search" type="button" class="btn btn-link btn-sm p-0" (click)="clearSearch()">Clear search</button>
          </div>

          <div class="repo-grid" *ngIf="filteredLength(items) > 0">
            <app-repo
              *ngFor="let item of currentPageItems(items)"
              [id]="item.id"
              [name]="item.name"
              [stars]="item.stargazers_count"
              [created]="item.created_at"
              [updated]="item.pushed_at"
              [description]="item.description"
              [fullName]="item.full_name"
              [topics]="item.topics || []"
            >
            </app-repo>
          </div>

          <div class="empty-state" *ngIf="search && filteredLength(items) === 0" role="status" aria-live="polite">
            <fa-icon [icon]="faSearch"></fa-icon>
            <h5>No repositories found</h5>
            <p>Nothing matches “{{ search }}”. Try a different name, description or topic.</p>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="clearSearch()">Clear search</button>
          </div>

          <mat-paginator
            *ngIf="filteredLength(items) > 0"
            [pageIndex]="page"
            [length]="filteredLength(items)"
            [pageSize]="catalogueService.CONF.pageSize"
            (page)="onPageChange($event)"
            [hidePageSize]="true"
          >
          </mat-paginator>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</section>
